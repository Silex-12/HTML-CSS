<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <p>
            <label for="nome"> nome</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome compelto" autocomplete="name">
        </p>
        <p>
            <label for="imedia">media</label>
           <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.5" value="5" required> 
        </p>
        <p>
            <label for="imes">perido letivo</label>
            <input type="month" name="mes" id="imes" value="2026-07">
        </p>
        <p><label for="idia">dia da prova</label>
        <input type="date" name="dia" id="idia" value="2026-02-03">
        </p>
        <p>
            <label for="ihora">hora da prova</label>
            <input type="time" name="hora" id="ihora">
        </p>
        <p>

            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
