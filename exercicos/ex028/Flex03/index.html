<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner {
            background-color: lightcoral;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">exemplo de Item 1</div>
        <div class="item">exemplo de Item 2</div>
        <div class="item">exemplo de Item 3</div>
        <div class="item">exemplo de Item 4</div>
        <div class="item">exemplo de Item 5</div>
        <div class="item">exemplo de Item 6</div>
        <div class="item">Item 7</div>
    </div>
</body>
</html>
