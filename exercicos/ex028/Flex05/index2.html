<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexbox</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      body {
        background-color: lightcoral;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      main {
        background-color: lightgreen;
        width: 90vh;
        height: 90vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      section {
        background-color: lightseagreen;
        width: 200px;
        height: 200px;

        display: flex;
        justify-content: center;
        align-items: center;

      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Tela de login</h1>
      </section>
    </main>
  </body>
</html>
