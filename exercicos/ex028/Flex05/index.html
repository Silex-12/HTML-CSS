<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        div.conteiner {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div.item {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            border: 1px solid black;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">
            <p>Item</p>
        </div>
    </div>
</body>
</html>
