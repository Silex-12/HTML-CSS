<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      div.conteiner {
        background-color: lightcoral;
        height: 400px;
        display: flex;
        flex-flow: row wrap;
        align-items: flex-start;


      }

      div.item {
        background-color: lightblue;
        border: 1px solid black;
        text-align: center;
        padding: 20px;
      }

      div.i1 {
      }

      div.i2 {
      }

      div.i3 {
        align-self: flex-end;
      }

      div.i4 {
      }

      div.i5 {
        align-self: center;
      }

      div.i6 {
      }

      div.i7 {
        align-self: stretch;
      }
    </style>
  </head>
  <body>
    <div class="conteiner">
      <div class="item" id="i1">Item 1</div>
      <div class="item" id="i2">Item 2</div>
      <div class="item" id="i3">Item 3</div>
      <div class="item" id="i4">Item 4</div>
      <div class="item" id="i5">Item 5</div>
      <div class="item" id="i6">Item 6</div>
      <div class="item" id="i7">Item 7</div>
    </div>
  </body>
</html>
